name: PR Review (Reusable)

on:
  workflow_call:
    inputs:
      model:
        description: "Claude model for small PRs (below large_pr_threshold)"
        type: string
        default: "claude-haiku-4-5"
      model_large:
        description: "Claude model for large PRs (>= large_pr_threshold). Used for deeper analysis."
        type: string
        default: "claude-sonnet-5"
      large_pr_threshold:
        description: "PRs with at least this many changed lines (additions+deletions) get the larger model and higher turn budget."
        type: number
        default: 100
      max_turns:
        description: "Max agent turns for small PRs"
        type: number
        default: 25
      max_turns_large:
        description: "Max agent turns for large PRs"
        type: number
        default: 60
      min_lines:
        description: "Skip PRs smaller than this many lines (additions+deletions). Bypassed by `needs-review` label."
        type: number
        default: 30
      runner:
        description: 'Runner spec as JSON. Default keeps GitHub-hosted ubuntu-latest; pass a JSON array (e.g. ''["self-hosted", "my-label"]'') to opt into a self-hosted runner.'
        type: string
        default: '"ubuntu-latest"'

# One review in flight per PR branch. Pushing again while a review is running
# cancels it: that review is already reading a diff nobody will merge, and every
# cancelled run is a model invocation not paid for. Keyed by head_branch because
# workflow_run carries no PR number.
concurrency:
  group: pr-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    # Skip promotion PRs (staging -> main): every commit in them was already
    # reviewed by its own PR into staging, so re-reviewing the whole train is
    # duplicated noise. Repos without a staging branch are unaffected.
    if: github.event.workflow_run.head_branch != 'staging'
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Set per-run review handoff dir
        # Per-run handoff dir for the review verdict/summary. MUST live under
        # RUNNER_TEMP (per-job, auto-cleaned) and be namespaced by run id —
        # a fixed /tmp path is shared by EVERY repo's review job on the same
        # self-hosted host, so a leftover file from another repo's run (worst
        # case root-owned and unoverwritable) gets read back and posted as THIS
        # PR's review. That cross-contamination put a safety-guides review on
        # unrelated PRs across all repos (2026-06).
        #
        # This is set in a step (not job-level `env:`) because the `runner.*`
        # context is unavailable in job-level `env` — using `${{ runner.temp }}`
        # there fails to compile the (reusable) workflow → startup_failure with
        # no jobs and "workflow file may be broken" (broke all 9 repos 2026-06).
        run: echo "REVIEW_DIR=$RUNNER_TEMP/claude-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Get PR info from workflow_run
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const headBranch = context.payload.workflow_run.head_branch;
            const headSha = context.payload.workflow_run.head_sha;

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${headBranch}`,
              state: 'open',
            });

            if (pulls.data.length === 0) {
              core.warning(`No open PR found for branch ${headBranch}`);
              core.setOutput('found', 'false');
              return;
            }

            const pr = pulls.data[0];

            // The branch moved while CI was queued: this run would review a
            // diff that is already superseded, and the newer push brings its
            // own CI + review. Bail before spending a model call.
            if (pr.head.sha !== headSha) {
              core.notice(`Stale run: CI ran on ${headSha.slice(0, 8)} but the PR tip is ${pr.head.sha.slice(0, 8)} — a newer run will review it.`);
              core.setOutput('found', 'false');
              return;
            }

            // What this App already reviewed, so a re-push costs an incremental
            // review instead of a second full read of the whole diff. Reviews
            // carry the commit they were submitted against.
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const mine = reviews.data.filter(r =>
              r.user && r.user.login.endsWith('[bot]') && r.commit_id &&
              (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED'));
            const last = mine.length ? mine[mine.length - 1] : null;

            core.setOutput('found', 'true');
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('author', pr.user.login);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', headSha);
            core.setOutput('last_reviewed_sha', last && last.commit_id !== headSha ? last.commit_id : '');
            core.setOutput('last_verdict', last ? last.state : '');

      - name: Skip if no PR found
        if: steps.pr.outputs.found != 'true'
        run: echo "No open PR found — skipping review."

      - name: Decide whether to review
        id: decide
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          MIN_LINES: ${{ inputs.min_lines }}
          LARGE_THRESHOLD: ${{ inputs.large_pr_threshold }}
          MODEL_SMALL: ${{ inputs.model }}
          MODEL_LARGE: ${{ inputs.model_large }}
          MAX_TURNS_SMALL: ${{ inputs.max_turns }}
          MAX_TURNS_LARGE: ${{ inputs.max_turns_large }}
          LAST_REVIEWED_SHA: ${{ steps.pr.outputs.last_reviewed_sha }}
          LAST_VERDICT: ${{ steps.pr.outputs.last_verdict }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          # Always read PR labels first — they can override every other filter.
          STATS=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                    --json additions,deletions,isDraft,files,labels)

          FULL_TOTAL=$(jq -r '.additions + .deletions' <<<"$STATS")
          TOTAL=$FULL_TOTAL
          RANGE=""

          # A PR this App already reviewed only needs the part that changed
          # since. Re-reading the whole diff on every push is what made one
          # 120-file PR cost three full Sonnet reviews (2026-09-21). Size the
          # model choice and the skip threshold on the increment, and tell the
          # prompt to read only that range.
          if [ -n "${LAST_REVIEWED_SHA:-}" ]; then
            if INCR=$(gh api "repos/$REPO/compare/$LAST_REVIEWED_SHA...$HEAD_SHA" \
                        --jq '[.files[]?.changes] | add // 0' 2>/dev/null); then
              TOTAL=$INCR
              RANGE="$LAST_REVIEWED_SHA...$HEAD_SHA"
              echo "::notice::Incremental review — $TOTAL changed lines since ${LAST_REVIEWED_SHA:0:8} (full PR is $FULL_TOTAL)."
            else
              # Force-push or rebase: the reviewed commit is gone from the
              # branch, so there is no honest increment. Fall back to the
              # whole diff rather than reviewing a range that does not exist.
              echo "::notice::Previously reviewed commit ${LAST_REVIEWED_SHA:0:8} is unreachable (force-push?) — reviewing the full diff."
            fi
          fi

          # Pick model + turn budget based on PR size. Tiny + skip filters below
          # may still bail out, but these outputs are emitted unconditionally so
          # the run step can read them without branching.
          if [ "$TOTAL" -ge "$LARGE_THRESHOLD" ]; then
            echo "chosen_model=$MODEL_LARGE" >> "$GITHUB_OUTPUT"
            echo "chosen_max_turns=$MAX_TURNS_LARGE" >> "$GITHUB_OUTPUT"
            echo "size_tier=large" >> "$GITHUB_OUTPUT"
          else
            echo "chosen_model=$MODEL_SMALL" >> "$GITHUB_OUTPUT"
            echo "chosen_max_turns=$MAX_TURNS_SMALL" >> "$GITHUB_OUTPUT"
            echo "size_tier=small" >> "$GITHUB_OUTPUT"
          fi

          echo "review_range=$RANGE" >> "$GITHUB_OUTPUT"

          # `needs-review` label: force review even on bots / tiny / docs-only PRs.
          FORCE=$(jq -r '.labels | map(.name) | index("needs-review") // empty' <<<"$STATS")
          if [ -n "$FORCE" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=forced via needs-review label" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `skip-review` label: explicit opt-out.
          SKIP_LBL=$(jq -r '.labels | map(.name) | index("skip-review") // empty' <<<"$STATS")
          if [ -n "$SKIP_LBL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=skip-review label" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip bot authors (dependabot, renovate, anything ending in [bot]).
          case "$PR_AUTHOR" in
            dependabot*|renovate*|*\[bot\])
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reason=bot author ($PR_AUTHOR)" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          DRAFT=$(jq -r '.isDraft' <<<"$STATS")

          if [ "$DRAFT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=draft PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tiny increment after a REQUEST_CHANGES is exactly the push that
          # claims to fix the blocking issue. Auto-approving it unread would
          # rubber-stamp the thing the review blocked on, so it always gets
          # looked at, however small.
          if [ "$TOTAL" -lt "$MIN_LINES" ] && [ "${LAST_VERDICT:-}" = "CHANGES_REQUESTED" ]; then
            echo "::notice::Increment is $TOTAL lines but the last verdict was REQUEST_CHANGES — reviewing it anyway."
          elif [ "$TOTAL" -lt "$MIN_LINES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=tiny PR ($TOTAL lines, threshold $MIN_LINES)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if every changed file is docs/lock/config-only. Judged on the
          # same set of files the review will actually read — the increment
          # when there is one, otherwise the whole PR.
          if [ -n "$RANGE" ]; then
            NON_TRIVIAL=$(gh api "repos/$REPO/compare/$RANGE" --jq \
              '[.files[]?.filename | select(test("\\.(md|lock|json|yml|yaml|txt)$") | not)] | length')
          else
            NON_TRIVIAL=$(jq -r '.files | map(.path) |
              map(select(test("\\.(md|lock|json|yml|yaml|txt)$") | not)) | length' <<<"$STATS")
          fi
          if [ "$NON_TRIVIAL" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=docs/lock/config only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=eligible" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.pr.outputs.found == 'true' && steps.decide.outputs.skip == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: echo "::notice::Skipping Claude review — $REASON"

      # Auto-approve skips that are pure token-saving filters so branch
      # protection (`required_approving_review_count: 1`) doesn't strand
      # the PR forever. Only approves reasons that mean "trivially safe,
      # not worth a Claude analysis"; explicit opt-outs (`skip-review`
      # label, draft PRs) are intentionally left without an approval.
      - name: Auto-approve trivial skip
        if: steps.pr.outputs.found == 'true' && steps.decide.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          case "$REASON" in
            'tiny PR'*|'docs/lock/config only'*|'bot author'*) ;;
            *) echo "::notice::Skip reason '$REASON' is not eligible for auto-approve."; exit 0 ;;
          esac
          ALREADY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviews \
            --jq '[.reviews[] | select(.state == "APPROVED" and (.author.login | endswith("[bot]")))] | length')
          if [ "$ALREADY" -gt 0 ]; then
            echo "::notice::Already approved by App; skipping."
            exit 0
          fi
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Auto-approved: ${REASON}. No Claude analysis performed — branch protection unblocks via this review."

      - name: Checkout PR code
        if: steps.pr.outputs.found == 'true' && steps.decide.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # Workaround for anthropics/claude-code-action#1290 — claude-code
      # 2.1.129 (published 2026-05-05) regressed its install logic so the
      # binary never lands at ~/.local/bin/claude. claude-code-action@v1
      # always pulls the latest, so pinning the action wouldn't help; we
      # pre-install a known-good version (2.1.128) and pass the binary
      # path to the action so it skips its own broken install. Once the
      # upstream fix lands (2.1.130+) this step + the
      # `path_to_claude_code_executable` input below can be removed.
      #
      # Uses the runner-image Node (20+ pre-installed on ubuntu-latest)
      # so we don't pull in `actions/setup-node` — that action's
      # `package-manager-cache: true` default sniffs the checked-out
      # repo for pnpm and dies if pnpm isn't on PATH.
      - name: Pre-install Claude Code 2.1.128 (workaround for upstream #1290)
        id: claude-bin
        if: steps.pr.outputs.found == 'true' && steps.decide.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Install to the user prefix so we don't need sudo and so the
          # binary lands in a stable, predictable location regardless of
          # the runner's global npm prefix.
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm install -g @anthropic-ai/claude-code@2.1.128
          BIN="$HOME/.npm-global/bin/claude"
          if [ ! -x "$BIN" ]; then
            echo "::error::claude binary not found at $BIN after npm install"
            ls -la "$HOME/.npm-global/bin/" || true
            exit 1
          fi
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Run Claude review
        if: steps.pr.outputs.found == 'true' && steps.decide.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PR_BASE: ${{ steps.pr.outputs.base_ref }}
          PR_HEAD: ${{ steps.pr.outputs.head_ref }}
          REVIEW_RANGE: ${{ steps.decide.outputs.review_range }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.claude-bin.outputs.path }}
          allowed_bots: "claude-sfmbbrand"
          claude_args: "--model ${{ steps.decide.outputs.chosen_model }} --max-turns ${{ steps.decide.outputs.chosen_max_turns }} --allowedTools Read,Glob,Grep,Bash"
          prompt: |
            You are an automated code reviewer for the ErosGuia International platform.

            ## Context
            - Repository: ${{ github.repository }}
            - PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.title }}
            - Author: ${{ steps.pr.outputs.author }}
            - Base: ${{ steps.pr.outputs.base_ref }} ← Head: ${{ steps.pr.outputs.head_ref }}

            ## Instructions

            1. Get the diff you are reviewing.

               `REVIEW_RANGE` is exported. **If it is non-empty, this PR was already
               reviewed by you and only the new commits need reviewing** — read that
               range and nothing else:

               ```
               git diff "$REVIEW_RANGE"
               ```

               Do not re-raise findings about code outside that range; it was covered
               by the earlier review and repeating it wastes the author's time. If the
               range touches something whose correctness depends on code outside it,
               read that code for context (step 2) but judge only the new changes.

               If `REVIEW_RANGE` is empty, this is a first review — read the whole diff:

               ```
               gh pr diff ${{ steps.pr.outputs.number }}
               ```

               If the `git diff` fails (the older commit can be missing after a
               force-push), fall back to the full `gh pr diff` and review everything.
               Reviewing too much is a waste; reviewing nothing is a hole.

            2. Read any changed files that need deeper inspection (use Read/Glob/Grep tools).

            3. If the repo has a CLAUDE.md file, read it to understand project conventions.

            4. Classify findings into two buckets:

               **Blocking** (set verdict to `REQUEST_CHANGES`):
               - Security vulnerabilities (SQL injection, XSS, exposed secrets/credentials)
               - Broken logic or bugs that would cause runtime errors
               - Data loss risk (missing validation at system boundaries, destructive operations without safeguards)
               - Missing critical error handling at system boundaries

               **Non-blocking** (do NOT change the verdict, but MUST appear in the summary):
               - Style preferences, naming suggestions
               - Minor refactoring opportunities
               - Documentation improvements
               - Performance optimizations that aren't critical
               - Edge cases worth handling defensively

            5. **Write your verdict and summary.** Both files are mandatory.

               When verdict is APPROVE, the summary MUST include:
               - A short "What this PR does" section (2-4 bullets)
               - A "Non-blocking observations" section with **2-4 specific suggestions** for improvement
                 (style, refactor, perf, docs, edge cases) referencing file paths or line numbers when possible.
                 Only write "None — change is minimal" if the diff is genuinely trivial (≤ 10 changed lines, e.g. a typo fix, version bump, or single-line CSS tweak). For anything bigger, finding zero observations is rare — look harder before defaulting to "None".

               Use these exact bash commands.

               APPROVE example:
               ```bash
               mkdir -p "$REVIEW_DIR"
               echo "APPROVE" > "$REVIEW_DIR/review-verdict.txt"
               cat > "$REVIEW_DIR/review-summary.md" << 'SUMMARY'
               ## Verdict: APPROVE — no blocking issues found

               <!-- When REVIEW_RANGE is non-empty, open with one line saying
                    which commits this review covers, e.g.
                    "Incremental review of the commits since <sha>; earlier
                    commits were covered by the previous review." -->

               ### What this PR does
               - <bullet 1>
               - <bullet 2>

               ### Non-blocking observations
               1. **<short title>** — <description, with `path/file.ext:LN` if applicable>
               2. **<short title>** — <description>
               SUMMARY
               ```

               REQUEST_CHANGES example:
               ```bash
               mkdir -p "$REVIEW_DIR"
               echo "REQUEST_CHANGES" > "$REVIEW_DIR/review-verdict.txt"
               cat > "$REVIEW_DIR/review-summary.md" << 'SUMMARY'
               ## Verdict: REQUEST_CHANGES

               ### Blocking issues
               1. **<short title>** — <description, file:line>

               ### Non-blocking observations
               <optional, same format as above>
               SUMMARY
               ```

            IMPORTANT: First run `mkdir -p "$REVIEW_DIR"`, then write both "$REVIEW_DIR/review-verdict.txt" and "$REVIEW_DIR/review-summary.md" (the $REVIEW_DIR env var is already exported for you). Do not skip this step and do not use a hardcoded /tmp path.

      - name: Approve and merge
        if: steps.pr.outputs.found == 'true' && steps.decide.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          VERDICT_FILE="$REVIEW_DIR/review-verdict.txt"
          SUMMARY_FILE="$REVIEW_DIR/review-summary.md"

          # Fail loud if the review step produced no verdict/summary THIS run.
          # These used to be fixed /tmp paths read with `|| echo` fallbacks, so a
          # stale leftover from another repo's run on a shared self-hosted host
          # was silently posted as this PR's review. Namespacing under
          # $REVIEW_DIR plus this guard makes a cross-contaminated or empty
          # review impossible (abort instead of posting a default/stale body).
          if [ ! -s "$VERDICT_FILE" ] || [ ! -s "$SUMMARY_FILE" ]; then
            echo "::error::Review output missing under $REVIEW_DIR — the review step produced no verdict/summary this run. Aborting instead of posting a default or stale review."
            exit 1
          fi
          VERDICT=$(cat "$VERDICT_FILE")
          SUMMARY=$(cat "$SUMMARY_FILE")

          echo "Verdict: $VERDICT"

          if [ "$VERDICT" = "APPROVE" ]; then
            echo "Approving PR #$PR_NUM..."
            if gh pr review "$PR_NUM" --approve --body "$SUMMARY"; then
              echo "Approved!"
              echo "Merging PR #$PR_NUM..."
              # `gh pr merge --auto` exits non-zero when auto-merge is already
              # enabled (e.g. when the PR author enabled it manually). That's
              # not a real failure — only warn if the failure is something else.
              MERGE_OUTPUT=$(gh pr merge "$PR_NUM" --squash --auto 2>&1) && MERGE_RC=$? || MERGE_RC=$?
              if [ "$MERGE_RC" -eq 0 ]; then
                echo "Merge initiated!"
              elif echo "$MERGE_OUTPUT" | grep -qiE 'auto.?merge.+(already|enabled)'; then
                echo "Auto-merge already enabled — nothing to do."
              else
                echo "::warning::Could not enable auto-merge: $MERGE_OUTPUT"
              fi
            else
              echo "::warning::Could not approve — likely self-review (PR opened by the same bot). Falling back to comment."
              FALLBACK_NOTE=$'\n\n---\n> :warning: **Automated review could not approve this PR.** GitHub blocks self-reviews, so when a PR is opened by the same bot that runs the review workflow, the review is posted as a comment instead. A human reviewer must approve manually to unblock auto-merge.'
              gh pr comment "$PR_NUM" --body "${SUMMARY}${FALLBACK_NOTE}"
            fi
          elif [ "$VERDICT" = "REQUEST_CHANGES" ]; then
            echo "Requesting changes on PR #$PR_NUM..."
            gh pr review "$PR_NUM" --request-changes --body "$SUMMARY"
          else
            echo "::warning::Unknown verdict: $VERDICT — skipping approve/merge"
          fi
